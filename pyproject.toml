[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "curvo"
version = "0.1.0"
description = "A bitter-lesson curvature-orchestration pipeline for membrane biology"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Jophin Joseph" }]
keywords = ["membrane curvature", "clathrin", "epsin", "AlphaFold", "Helfrich", "orchestration"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "numpy",
    "scipy",
    "requests",
]

[project.optional-dependencies]
plots = ["matplotlib"]
dev = ["pytest"]

[project.urls]
Homepage = "https://github.com/jjbaloo2023/curvo"

[project.scripts]
curvo-demo = "run_demo:main"

[tool.setuptools]
packages = ["curvo"]
py-modules = ["run_demo"]
