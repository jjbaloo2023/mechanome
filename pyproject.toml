[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "curvo"
version = "0.2.0"
description = "A bitter-lesson curvature-orchestration pipeline for membrane biology"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Jophin Joseph" }]
keywords = ["membrane curvature", "clathrin", "epsin", "AlphaFold", "Helfrich", "orchestration"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
# Floors are conservative minimums (well below the tested env: Python 3.11,
# numpy 2.4, scipy 1.17, matplotlib 3.11, requests 2.34); upper bounds left open.
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "requests>=2.28",
]

[project.optional-dependencies]
plots = ["matplotlib>=3.7"]
# Bayesian inference engine (Phase 2+): nested sampling + MCMC. Pure-Python,
# CPU-friendly. Amortized SBI (torch/sbi) is a documented seam, not a dependency.
inference = ["dynesty>=2.1", "emcee>=3.1", "corner>=2.2"]
# Structure-cartoon schematics (validation/realdata/schematic_idiom.py): biotite
# assigns secondary structure (P-SEA) from cached PDB/AlphaFold CA traces.
figures = ["biotite>=0.40"]
dev = ["pytest>=7.0"]

[project.urls]
Homepage = "https://github.com/jjbaloo2023/mechanome"

[project.scripts]
curvo-demo = "run_demo:main"

[tool.setuptools]
packages = ["curvo", "validation", "mechanome"]
py-modules = ["run_demo"]
