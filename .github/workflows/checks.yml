name: Core software checks

on: [push, pull_request]

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e ".[dev,plots,inference]"
      - name: Check core contracts without scientific study replays
        run: >-
          python -m pytest -q -p no:cacheprovider
          tests/test_pipeline_contracts.py tests/test_imports.py
          tests/test_players.py tests/test_mechanome_modules.py
          tests/test_parameter_store.py tests/test_scientific_guards.py
